apiVersion: dns.vke.volcengine.com/v1beta1
kind: DNS
metadata:
  name: cr-cache-dockerhub-dev
  namespace: {{ .Release.Namespace }}
spec:
  dnsType: private
  recordSpec:
    rrs:
      - {{ .Values.dns.dockerhub.domain }}.cr
    ttl: 600
    type: A
    valueSpec:
      values:
        - {{ .Values.dns.dockerhub.ip }}
  zoneName: volces.com